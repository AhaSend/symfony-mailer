name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        symfony: ["7.4", "8.0", "8.1", "8.2"]
        exclude: # Symfony 8 needs PHP 8.4+
          - { php: "8.2", symfony: "8.0" }
          - { php: "8.2", symfony: "8.1" }
          - { php: "8.2", symfony: "8.2" }
          - { php: "8.3", symfony: "8.0" }
          - { php: "8.3", symfony: "8.1" }
          - { php: "8.3", symfony: "8.2" }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      # Flex pins every symfony/* package to the version under test.
      - name: Pin Symfony ${{ matrix.symfony }}
        run: |
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "${{ matrix.symfony }}.*"
          composer require --dev --no-update --no-interaction symfony/flex
      - name: Allow the Symfony 8.2 pre-release
        if: matrix.symfony == '8.2'
        run: |
          composer config minimum-stability beta
          composer config prefer-stable true
      # Symfony 8.0 is end-of-life and has open advisories, which Composer blocks by default.
      - run: composer update --no-interaction --no-progress ${{ matrix.symfony == '8.0' && '--no-security-blocking' || '' }}
      - run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies (PHP 8.2 / Symfony 7.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Pin Symfony 7.4
        run: |
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "7.4.*"
          composer require --dev --no-update --no-interaction symfony/flex
      - run: composer update --no-interaction --no-progress --prefer-lowest
      # The oldest doctrine/lexer and egulias/email-validator raise deprecations about each other.
      - run: vendor/bin/phpunit --do-not-fail-on-deprecation
